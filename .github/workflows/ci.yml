name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test-backend:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'
        cache: 'pip'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r backend/api/requirements.txt
    
    - name: Check Python syntax
      run: |
        python -m py_compile agents/*.py backend/api/server.py
        echo "✓ Python syntax check passed"
    
    - name: Test backend imports
      run: |
        cd backend/api
        python -c "from server import app; print('✓ Backend imports successful')"

  test-frontend:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: frontend/Dashboard/package-lock.json
    
    - name: Install dependencies
      run: |
        cd frontend/Dashboard
        npm ci
    
    - name: TypeScript type check
      run: |
        cd frontend/Dashboard
        npm run lint
        echo "✓ TypeScript type check passed"
    
    - name: Build frontend
      run: |
        cd frontend/Dashboard
        npm run build
        echo "✓ Frontend build successful"

  docker-build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Build backend Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile.backend
        push: false
        tags: zkredit-backend:test
        cache-from: type=gha
        cache-to: type=gha,mode=max
    
    - name: Build frontend Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile.frontend
        push: false
        tags: zkredit-frontend:test
        cache-from: type=gha
        cache-to: type=gha,mode=max